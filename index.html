<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🌸 六月萌寵進化大冒險 🐾</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'ZCOOL KuaiLe', sans-serif; background: linear-gradient(135deg, #f0fdf4 0%, #e0f2fe 100%); overflow-x: hidden; min-height: 100vh; }
        .monster-bounce { animation: bounce 2.2s infinite ease-in-out; }
        @keyframes bounce { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-12px) scale(1.02, 0.98); } }
        .btn-active:active { transform: scale(0.95) translateY(5px); box-shadow: none !important; }
        .stat-card { background: white; border: 3px solid #e0f2fe; box-shadow: 0 8px 0 #bae6fd; }
        .ultimate-glow { filter: drop-shadow(0 0 15px rgba(14, 165, 233, 0.7)); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // 雲端連線設定 (沿用您的 ID)
        const SYNC_ID = "2e4fa9da5e86da8df3e0"; 
        const API_URL = `https://api.npoint.io/${SYNC_ID}`;

        const NAMES = ["鄭程元", "黃天福", "陳侑麟", "徐睦桓", "廖康宇", "王又恩", "曾喜澤", "張劭宇", "王習聿", "黃守睿", "林成駿", "陳品齊", "苑世為", "廖崇聿", "李昀貞", "王岱扉", "梁庭榛", "陳詩穎", "黃歆媛", "盧怡安", "魏若樺", "林可芯", "周芫亘", "墜書悅", "秦若瑜", "王育安", "黃品瑜", "陳侑承"];

        const getTraits = (name) => {
            let hash = 0;
            for (let i = 0; i < name.length; i++) { hash = ((hash << 5) - hash) + name.charCodeAt(i); hash |= 0; }
            const s = Math.abs(hash);
            
            // HSL 色相環精確分配 (360度 / 28人)，確保 28 人顏色絕對唯一
            const nameIndex = NAMES.indexOf(name);
            const hue = (nameIndex * (360 / NAMES.length)) % 360;
            
            return { 
                seed: s, 
                colors: {
                    body: `hsl(${hue}, 80%, 60%)`,      // 主色：繽紛活潑
                    belly: `hsl(${(hue + 60) % 360}, 90%, 88%)`, // 腹部：高對比互補色
                    accent: `hsl(${(hue + 180) % 360}, 95%, 70%)`, // 裝飾/犄角：三合一互補
                    stroke: `hsl(${hue}, 85%, 22%)`     // 邊框：同色系深色
                }, 
                bodyShape: s % 7,  // 7種全新六月體型
                earType: (s >> 2) % 5, // 5種全新頭頂裝飾
                pattern: (s >> 4) % 3  // 3種全新蛋殼花紋
            };
        };

        const Monster = ({ name, laps, size = 200, isMini = false }) => {
            const { seed, colors, bodyShape, earType, pattern } = useMemo(() => getTraits(name), [name]);
            
            // 進化邏輯：15圈破蛋，之後每10圈晉級
            let stage = laps < 15 ? 0 : 1 + Math.floor((laps - 15) / 10);
            const effectiveStage = Math.min(stage, 6);
            const isEgg = effectiveStage === 0;

            const headR = isEgg ? 0 : 42 - (effectiveStage * 3.5);
            const bodyH = isEgg ? 0 : 12 + (effectiveStage * 11);
            const bodyW = isEgg ? 0 : 38 + (effectiveStage * 5);

            // 六月全新身體模型生成器
            const renderBodyShape = (w, h, fill, stroke) => {
                const x = 50 - w/2;
                const y = 112 - h;
                switch(bodyShape) {
                    case 0: // 雲朵朵型
                        return <path d={`M ${x} ${112-h*0.3} Q ${x-5} ${y+h*0.3} ${x+w*0.2} ${y+h*0.1} Q 50 ${y-10} ${50+w*0.3} ${y+h*0.1} Q ${x+w+5} ${y+h*0.3} ${x+w} ${112-h*0.3} Q ${50+w*0.3} ${112+5} 50 112 Q ${x+w*0.2} ${112+5} ${x} ${112-h*0.3} Z`} fill={fill} stroke={stroke} strokeWidth="1.5" />;
                    case 1: // 鑽石水晶型
                        return <polygon points={`50,${y} ${50+w/2},${y+h/2} 50,112 ${50-w/2},${y+h/2}`} fill={fill} stroke={stroke} strokeWidth="1.5" />;
                    case 2: // 溫暖愛心型
                        return <path d={`M 50 ${y+h*0.3} C ${50-w*0.6} ${y-h*0.1} ${50-w*0.6} ${y+h*0.7} 50 112 C ${50+w*0.6} ${y+h*0.7} ${50+w*0.6} ${y-h*0.1} 50 ${y+h*0.3}`} fill={fill} stroke={stroke} strokeWidth="1.5" />;
                    case 3: // 寶石八角形
                        return <polygon points={`${50-w*0.25},${y} ${50+w*0.25},${y} ${50+w*0.5},${y+h*0.3} ${50+w*0.5},${y+h*0.75} ${50+w*0.25},112 ${50-w*0.25},112 ${50-w*0.5},${y+h*0.75} ${50-w*0.5},${y+h*0.3}`} fill={fill} stroke={stroke} strokeWidth="1.5" />;
                    case 4: // 沙漏沙漏型
                        return <path d={`M ${50-w*0.35} ${y} L ${50+w*0.35} ${y} Q 50 ${y+h*0.5} ${50+w*0.5} 112 L ${50-w*0.5} 112 Q 50 ${y+h*0.5} ${50-w*0.35} ${y} Z`} fill={fill} stroke={stroke} strokeWidth="1.5" />;
                    case 5: // 水滴雨滴型
                        return <path d={`M 50 ${y} Q ${50-w*0.5} ${y+h*0.5} ${50-w*0.5} 112 Q 50 115 ${50+w*0.5} 112 Q ${50+w*0.5} ${y+h*0.5} 50 ${y}`} fill={fill} stroke={stroke} strokeWidth="1.5" />;
                    case 6: // 星空盾牌型
                        return <path d={`M 50 ${y} L ${50+w*0.5} ${y+h*0.25} L ${50+w*0.3} 112 L ${50-w*0.3} 112 L ${50-w*0.5} ${y+h*0.25} Z`} fill={fill} stroke={stroke} strokeWidth="1.5" />;
                    default: // 圓潤嘟嘟型
                        return <ellipse cx="50" cy={112-h/2} rx={w/2} ry={h/2} fill={fill} stroke={stroke} strokeWidth="1.5" />;
                }
            };

            return (
                <svg width={size} height={size * 1.15} viewBox="0 0 100 120" className={effectiveStage >= 6 ? "ultimate-glow" : ""}>
                    <defs><radialGradient id={`g-${seed}`} cx="35%" cy="35%" r="65%"><stop offset="0%" stopColor="white" stopOpacity="0.4" /><stop offset="100%" stopColor={colors.body} /></radialGradient></defs>
                    <ellipse cx="50" cy="115" rx={isMini ? 30 : 20 + effectiveStage * 6} ry="8" fill="black" opacity="0.1" />
                    <g className={isMini ? "" : "monster-bounce"}>
                        {isEgg ? (
                            <g>
                                <path d="M50 35 C30 35 24 92 50 92 C76 92 70 35 50 35 Z" fill={colors.body} stroke={colors.stroke} strokeWidth="1.5" />
                                {/* 六月全新神祕花紋：0-14 圈無眼睛，維持神祕感 */}
                                {pattern === 0 && <path d="M35 55 L50 60 L38 68 L55 70 L42 78 L60 80" fill="none" stroke="white" strokeWidth="2.5" strokeLinecap="round" opacity="0.5" />}
                                {pattern === 1 && <path d="M 33 65 A 6 6 0 0 1 45 65 A 6 6 0 0 1 57 65 A 6 6 0 0 1 69 65" fill="none" stroke="white" strokeWidth="2.5" strokeLinecap="round" opacity="0.4" />}
                                {pattern === 2 && (
                                    <g fill="white" opacity="0.5">
                                        <polygon points="50,50 54,54 50,58 46,54" />
                                        <polygon points="36,65 39,68 36,71 33,68" />
                                        <polygon points="64,65 67,68 64,71 61,68" />
                                    </g>
                                )}
                            </g>
                        ) : (
                            <g>
                                <g fill={colors.stroke}>
                                    <rect x="30" y="100" width="15" height="15" rx="7.5" />
                                    <rect x="55" y="100" width="15" height="15" rx="7.5" />
                                    {effectiveStage >= 2 && <g fill={colors.body} stroke={colors.stroke}><rect x={50-bodyW/2-10} y="75" width="12" height="25" rx="6" transform="rotate(20,35,75)"/><rect x={50+bodyW/2-2} y="75" width="12" height="25" rx="6" transform="rotate(-20,65,75)"/></g>}
                                </g>
                                {renderBodyShape(bodyW, bodyH, `url(#g-${seed})`, colors.stroke)}
                                <ellipse cx="50" cy={112-bodyH/2} rx={bodyW/3.5} ry={bodyH/2.8} fill={colors.belly} opacity="0.7" />
                                
                                <g transform={`translate(0, ${112-bodyH-headR*0.75})`}>
                                    {/* 六月全新頭部裝飾生成器 */}
                                    <g stroke={colors.stroke} strokeWidth="1.5" fill="none">
                                        {earType === 0 && ( /* 神木鹿角 */
                                            <g stroke={colors.stroke} strokeWidth="1.5" fill="none">
                                                <path d={`M ${50 - headR*0.5} ${30 - headR*0.8} L ${50 - headR*0.9} ${30 - headR*1.6} L ${50 - headR*1.2} ${30 - headR*1.9} M ${50 - headR*0.9} ${30 - headR*1.6} L ${50 - headR*0.6} ${30 - headR*2.1}`} />
                                                <path d={`M ${50 + headR*0.5} ${30 - headR*0.8} L ${50 + headR*0.9} ${30 - headR*1.6} L ${50 + headR*1.2} ${30 - headR*1.9} M ${50 + headR*0.9} ${30 - headR*1.6} L ${50 + headR*0.6} ${30 - headR*2.1}`} />
                                            </g>
                                        )}
                                        {earType === 1 && ( /* 天使聖環 */
                                            <ellipse cx="50" cy={30 - headR * 1.2} rx={headR * 0.8} ry={headR * 0.25} fill="none" stroke="gold" strokeWidth="2.5" opacity="0.9" />
                                        )}
                                        {earType === 2 && ( /* 太空天線 */
                                            <g stroke={colors.stroke} strokeWidth="1.5" fill="none">
                                                <path d={`M ${50 - headR*0.4} ${30 - headR*0.9} Q ${50 - headR*0.8} ${30 - headR*1.5} ${50 - headR*0.8} ${30 - headR*1.7}`} />
                                                <path d={`M ${50 + headR*0.4} ${30 - headR*0.9} Q ${50 + headR*0.8} ${30 - headR*1.5} ${50 + headR*0.8} ${30 - headR*1.7}`} />
                                                <circle cx={50 - headR*0.8} cy={30 - headR*1.7} r="3" fill={colors.accent} stroke={colors.stroke} strokeWidth="1" />
                                                <circle cx={50 + headR*0.8} cy={30 - headR*1.7} r="3" fill={colors.accent} stroke={colors.stroke} strokeWidth="1" />
                                            </g>
                                        )}
                                        {earType === 3 && ( /* 溫柔綿羊角 */
                                            <g stroke={colors.stroke} strokeWidth="2" fill="none">
                                                <path d={`M ${50 - headR*0.6} ${30 - headR*0.5} Q ${50 - headR*1.3} ${30 - headR*1.2} ${50 - headR*1.3} ${30 - headR*0.6} Q ${50 - headR*0.9} ${30 - headR*0.2} ${50 - headR*0.6} ${30 - headR*0.5}`} />
                                                <path d={`M ${50 + headR*0.6} ${30 - headR*0.5} Q ${50 + headR*1.3} ${30 - headR*1.2} ${50 + headR*1.3} ${30 - headR*0.6} Q ${50 + headR*0.9} ${30 - headR*0.2} ${50 + headR*0.6} ${30 - headR*0.5}`} />
                                            </g>
                                        )}
                                        {earType === 4 && ( /* 國王皇冠 */
                                            <polygon points={`${50 - headR*0.5},${30 - headR*0.8} ${50 - headR*0.3},${30 - headR*1.3} 50,${30 - headR*0.9} ${50 + headR*0.3},${30 - headR*1.3} ${50 + headR*0.5},${30 - headR*0.8}`} fill={colors.accent} stroke={colors.stroke} strokeWidth="1.5" />
                                        )}
                                    </g>
                                    
                                    <circle cx="50" cy="30" r={headR} fill={`url(#g-${seed})`} stroke={colors.stroke} strokeWidth="1" />
                                    
                                    {/* 破蛋後長出的大眼睛 */}
                                    <g>
                                        <circle cx="38" cy="25" r={headR/5} fill="white" />
                                        <circle cx="62" cy="25" r={headR/5} fill="white" />
                                        <circle cx="38" cy="25" r={headR/10} fill={colors.stroke} />
                                        <circle cx="62" cy="25" r={headR/10} fill={colors.stroke} />
                                        <circle cx="39" cy="23" r={headR/25} fill="white" opacity="0.8" />
                                    </g>
                                    <path d="M46 38 Q50 42 54 38" fill="none" stroke={colors.stroke} strokeWidth="2.5" strokeLinecap="round" />
                                </g>
                            </g>
                        )}
                    </g>
                </svg>
            );
        };

        const App = () => {
            const [user, setUser] = useState(null);
            const [data, setData] = useState({});
            const [loading, setLoading] = useState(true);
            const dataRef = useRef({});

            // 讀取最新雲端大數據，隔離歷史數據，自動初始化六月
            const fetchData = async () => {
                try {
                    const res = await fetch(API_URL);
                    if (res.ok) {
                        const json = await res.json();
                        // 讀取六月份專屬數據資料夾：june_v1 (此舉直接將五月紀錄清空)
                        const monthData = json.june_v1 || {};
                        setData(monthData);
                        dataRef.current = monthData;
                    }
                    setLoading(false);
                } catch (e) { console.error("Sync Error", e); }
            };

            useEffect(() => {
                fetchData();
                const timer = setInterval(fetchData, 5000);
                const saved = localStorage.getItem('june_v1_active_user');
                if (saved) setUser(saved);
                return () => clearInterval(timer);
            }, []);

            // 雲端同步更新 (先抓取全局再寫入，保留其餘月份，不損壞資料)
            const sync = async (newVal) => {
                if (!user) return;
                const updatedData = { ...dataRef.current, [user]: Math.max(0, newVal) };
                setData(updatedData);
                dataRef.current = updatedData;
                try {
                    const getRes = await fetch(API_URL);
                    let currentGlobal = {};
                    if (getRes.ok) {
                        currentGlobal = await getRes.json();
                    }
                    currentGlobal.june_v1 = updatedData;

                    await fetch(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(currentGlobal)
                    });
                } catch (e) { console.error("Upload Error", e); }
            };

            const stats = useMemo(() => {
                const laps = NAMES.map(n => data[n] || 0);
                const total = laps.reduce((a, b) => a + b, 0);
                const hatched = laps.filter(l => l >= 15).length;
                return { total, hatched, average: (total / NAMES.length).toFixed(1) };
            }, [data]);

            const sorted = NAMES.map(n => ({ name: n, laps: data[n] || 0 })).sort((a, b) => b.laps - a.laps);

            const StatsBoard = () => (
                <div className="w-full max-w-4xl mx-auto grid grid-cols-3 gap-4 mb-8">
                    <div className="stat-card p-4 rounded-3xl text-center">
                        <div className="text-teal-500 text-[10px] font-black uppercase italic leading-tight">六月總圈數</div>
                        <div className="text-3xl font-black text-teal-800">{stats.total}</div>
                    </div>
                    <div className="stat-card p-4 rounded-3xl text-center border-amber-100 shadow-[#fef3c7]">
                        <div className="text-amber-500 text-[10px] font-black uppercase italic leading-tight">六月已破蛋</div>
                        <div className="text-3xl font-black text-amber-600">{stats.hatched} <small className="text-xs">/ 28</small></div>
                    </div>
                    <div className="stat-card p-4 rounded-3xl text-center border-sky-100 shadow-[#e0f2fe]">
                        <div className="text-sky-500 text-[10px] font-black uppercase italic leading-tight">全班平均</div>
                        <div className="text-3xl font-black text-sky-700">{stats.average}</div>
                    </div>
                </div>
            );

            const Leaderboard = () => (
                <div className="w-full max-w-5xl mx-auto bg-white/80 backdrop-blur rounded-[3rem] p-8 border-4 border-white shadow-xl mt-12 mb-20">
                    <h3 className="text-3xl font-black text-teal-800 mb-8 flex items-center gap-3 italic">🏆 六月份全班即時排行榜</h3>
                    <div className="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-7 gap-6">
                        {sorted.map((p, idx) => (
                            <div key={p.name} className={`relative p-3 rounded-3xl border-2 transition-all ${p.name === user ? 'bg-sky-50 border-sky-300 scale-105 shadow-md z-10' : 'bg-white border-slate-50'}`}>
                                <div className="absolute -top-2 -left-2 w-7 h-7 bg-yellow-400 rounded-full flex items-center justify-center text-white font-black text-[10px] border-2 border-white shadow-sm">{idx + 1}</div>
                                <div className="text-center font-black text-slate-700 text-xs truncate">{p.name}</div>
                                <div className="h-16 flex items-center justify-center my-1"><Monster name={p.name} laps={p.laps} size={60} isMini={true} /></div>
                                <div className="text-center text-lg font-black text-sky-600 leading-none">{p.laps} <small className="text-[8px] font-normal">圈</small></div>
                            </div>
                        ))}
                    </div>
                </div>
            );

            if (loading) return (
                <div className="min-h-screen flex flex-col items-center justify-center bg-white text-teal-600">
                    <div className="w-12 h-12 border-4 border-teal-500 border-t-transparent rounded-full animate-spin mb-4"></div>
                    <div className="text-xl font-black animate-pulse">正在為您開闢六月全新冒險...</div>
                </div>
            );

            return (
                <div className="min-h-screen p-4 flex flex-col items-center">
                    <header className="w-full mt-4 mb-4">
                        <StatsBoard />
                    </header>

                    {!user ? (
                        <div className="flex flex-col items-center w-full">
                            <h1 className="text-6xl font-black text-teal-800 mb-8 italic tracking-tighter">🌸 六月萌寵進化大冒險 🐾</h1>
                            <div className="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-7 gap-4 w-full max-w-7xl">
                                {NAMES.map(n => (
                                    <button key={n} onClick={() => { setUser(n); localStorage.setItem('june_v1_active_user', n); }} className="bg-white p-6 rounded-3xl shadow hover:shadow-xl transition-all border-4 border-transparent hover:border-sky-400 font-bold text-lg text-slate-700">
                                        {n}<div className="text-xs text-sky-400 mt-1 font-black">{data[n] || 0} 圈</div>
                                    </button>
                                ))}
                            </div>
                        </div>
                    ) : (
                        <div className="w-full max-w-2xl bg-white rounded-[4rem] shadow-2xl p-10 text-center border-8 border-white relative mb-12">
                            <button onClick={() => { setUser(null); localStorage.removeItem('june_v1_active_user'); }} className="absolute top-6 right-8 text-slate-300 underline font-bold">換人</button>
                            <h2 className="text-8xl font-black text-slate-800 mb-6 italic tracking-tighter">{user}</h2>
                            <div className="bg-sky-50/50 rounded-[4rem] h-80 flex items-center justify-center mb-8 shadow-inner border-4 border-white relative">
                                <Monster name={user} laps={data[user] || 0} size={350} />
                                <div className="absolute bottom-4 bg-white/90 px-6 py-2 rounded-full font-black text-sky-600 shadow-md text-xs italic">
                                    {(data[user] || 0) < 15 ? `距離破蛋還差 ${15 - (data[user] || 0)} 圈` : `六月晉級還差 ${10 - ((data[user] - 15) % 10)} 圈`}
                                </div>
                            </div>
                            <div className="text-[120px] font-black text-sky-600 leading-none mb-10 italic tracking-tighter">{data[user] || 0} <span className="text-2xl text-slate-300 not-italic">圈</span></div>
                            <button onClick={() => sync((data[user] || 0) + 1)} className="bg-slate-900 text-white w-full py-12 rounded-[3rem] text-8xl shadow-[0_15px_0_#000] btn-active transition-all flex flex-col items-center group">
                                <span className="mb-4 text-9xl group-active:scale-90 transition-transform">🐾</span><span className="text-4xl font-black italic tracking-widest uppercase">完成一圈</span>
                            </button>
                            <button onClick={() => sync((data[user] || 0) - 1)} className="mt-8 text-slate-300 text-sm underline font-bold">按錯了？扣除一圈</button>
                        </div>
                    )}

                    <Leaderboard />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
