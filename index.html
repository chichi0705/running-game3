<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🌸 五月份萌寵進化賽 🐾</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'ZCOOL KuaiLe', sans-serif; background-color: #fdf2f8; overflow-x: hidden; }
        .monster-bounce { animation: bounce 2.2s infinite ease-in-out; }
        @keyframes bounce { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-12px) scale(1.02, 0.98); } }
        .btn-active:active { transform: scale(0.95) translateY(5px); box-shadow: none !important; }
        .stat-card { background: white; border: 3px solid #fce7f3; box-shadow: 0 8px 0 #fce7f3; }
        .ultimate-glow { filter: drop-shadow(0 0 15px rgba(236, 72, 153, 0.6)); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // 雲端連線設定 (沿用您的 ID)
        const SYNC_ID = "2e4fa9da5e86da8df3e0"; 
        const API_URL = `https://api.npoint.io/${SYNC_ID}`;

        const NAMES = ["鄭程元", "黃天福", "陳侑麟", "徐睦桓", "廖康宇", "王又恩", "曾喜澤", "張劭宇", "王習聿", "黃守睿", "林成駿", "陳品齊", "苑世為", "廖崇聿", "李昀貞", "王岱扉", "梁庭榛", "陳詩穎", "黃歆媛", "盧怡安", "魏若樺", "林可芯", "周芫亘", "墜書悅", "秦若瑜", "王育安", "黃品瑜", "陳侑承"];

        const getTraits = (name) => {
            let hash = 0;
            for (let i = 0; i < name.length; i++) { hash = ((hash << 5) - hash) + name.charCodeAt(i); hash |= 0; }
            const s = Math.abs(hash);
            
            // 使用名單索引來確保 28 人顏色絕對不同 (360度平分)
            const nameIndex = NAMES.indexOf(name);
            const hue = (nameIndex * (360 / NAMES.length)) % 360;
            
            return { 
                seed: s, 
                colors: {
                    body: `hsl(${hue}, 75%, 65%)`,      // 主色：明亮活潑
                    belly: `hsl(${(hue + 40) % 360}, 85%, 90%)`, // 腹部：粉嫩配色
                    stroke: `hsl(${hue}, 80%, 25%)`     // 邊框：深色對比
                }, 
                bodyShape: s % 7, // 7種不同體型
                earType: (s >> 2) % 5,
                pattern: (s >> 4) % 3
            };
        };

        const Monster = ({ name, laps, size = 200, isMini = false }) => {
            const { seed, colors, bodyShape, earType, pattern } = useMemo(() => getTraits(name), [name]);
            let stage = laps < 15 ? 0 : 1 + Math.floor((laps - 15) / 10);
            const effectiveStage = Math.min(stage, 6);
            const isEgg = effectiveStage === 0;

            const headR = isEgg ? 0 : 42 - (effectiveStage * 3.5);
            const bodyH = isEgg ? 0 : 12 + (effectiveStage * 11);
            const bodyW = isEgg ? 0 : 38 + (effectiveStage * 5);

            const renderBodyShape = (w, h, fill, stroke) => {
                const x = 50 - w/2;
                const y = 112 - h;
                switch(bodyShape) {
                    case 1: return <rect x={x} y={y} width={w} height={h} rx="12" fill={fill} stroke={stroke} strokeWidth="1.5" />; // 方形
                    case 2: return <path d={`M50 ${y} L${50+w/2} 112 L${50-w/2} 112 Z`} fill={fill} stroke={stroke} strokeWidth="1.5" />; // 三角
                    case 3: return <path d={`M${50-w/2} ${y} Q50 ${y-10} ${50+w/2} ${y} L${50+w/2} 112 Q50 118 ${50-w/2} 112 Z`} fill={fill} stroke={stroke} strokeWidth="1.5" />; // 盾牌
                    case 4: return <path d={`M50 ${y} L${50+w/4} ${y+h/3} L${50+w/2} ${y+h/3} L${50+w/4} ${y+h/1.8} L${50+w/2} 112 L50 ${y+h/1.3} L${50-w/2} 112 L${50-w/4} ${y+h/1.8} L${50-w/2} ${y+h/3} L${50-w/4} ${y+h/3} Z`} fill={fill} stroke={stroke} strokeWidth="1.5" />; // 星型
                    case 5: return <rect x={x} y={y} width={w} height={h} rx={w/2} fill={fill} stroke={stroke} strokeWidth="1.5" />; // 膠囊
                    case 6: return <path d={`M50 ${y} L${50+w/2} ${y+h/3} L${50+w/2} ${y+h*0.8} L50 112 L${50-w/2} ${y+h*0.8} L${50-w/2} ${y+h/3} Z`} fill={fill} stroke={stroke} strokeWidth="1.5" />; // 六角
                    default: return <ellipse cx="50" cy={112-h/2} rx={w/2} ry={h/2} fill={fill} stroke={stroke} strokeWidth="1.5" />; // 橢圓
                }
            };

            return (
                <svg width={size} height={size * 1.15} viewBox="0 0 100 120" className={effectiveStage >= 6 ? "ultimate-glow" : ""}>
                    <defs><radialGradient id={`g-${seed}`} cx="35%" cy="35%" r="65%"><stop offset="0%" stopColor="white" stopOpacity="0.4" /><stop offset="100%" stopColor={colors.body} /></radialGradient></defs>
                    <ellipse cx="50" cy="115" rx={isMini ? 30 : 20 + effectiveStage * 6} ry="8" fill="black" opacity="0.1" />
                    <g className={isMini ? "" : "monster-bounce"}>
                        {isEgg ? (
                            <g>
                                <path d="M50 35 C30 35 24 92 50 92 C76 92 70 35 50 35 Z" fill={colors.body} stroke={colors.stroke} strokeWidth="1.5" />
                                {seed % 3 === 0 ? <circle cx="42" cy="65" r="4" fill="white" opacity="0.5" /> : <path d="M40 60 Q50 55 60 60" fill="none" stroke="white" strokeWidth="2" opacity="0.4" />}
                            </g>
                        ) : (
                            <g>
                                <g fill={colors.stroke}>
                                    <rect x="30" y="100" width="15" height="15" rx="7.5" />
                                    <rect x="55" y="100" width="15" height="15" rx="7.5" />
                                    {effectiveStage >= 2 && <g fill={colors.body} stroke={colors.stroke}><rect x={50-bodyW/2-10} y="75" width="12" height="25" rx="6" transform="rotate(20,35,75)"/><rect x={50+bodyW/2-2} y="75" width="12" height="25" rx="6" transform="rotate(-20,65,75)"/></g>}
                                </g>
                                {renderBodyShape(bodyW, bodyH, `url(#g-${seed})`, colors.stroke)}
                                <ellipse cx="50" cy={112-bodyH/2} rx={bodyW/3.5} ry={bodyH/2.8} fill={colors.belly} opacity="0.7" />
                                <g transform={`translate(0, ${112-bodyH-headR*0.75})`}>
                                    <g fill={colors.body} stroke={colors.stroke} strokeWidth="1.5">
                                        {earType === 0 && <><path d="M25 15 L5 -10 L40 10 Z" /><path d="M75 15 L95 -10 L60 10 Z" /></>}
                                        {earType === 1 && <><circle cx="20" cy="15" r="12" /><circle cx="80" cy="15" r="12" /></>}
                                        {earType === 2 && <><ellipse cx="28" cy="0" rx="7" ry="25" transform="rotate(-15,28,0)" /><ellipse cx="72" cy="0" rx="7" ry="25" transform="rotate(15,72,0)" /></>}
                                        {earType === 3 && <><rect x="12" y="15" width="12" height="30" rx="6" /><rect x="76" y="15" width="12" height="30" rx="6" /></>}
                                        {earType === 4 && <path d="M40 5 L50 -15 L60 5" fill={colors.belly} />}
                                    </g>
                                    <circle cx="50" cy="30" r={headR} fill={`url(#g-${seed})`} stroke={colors.stroke} />
                                    <g>
                                        <circle cx="38" cy="25" r={headR/5} fill="white" />
                                        <circle cx="62" cy="25" r={headR/5} fill="white" />
                                        <circle cx="38" cy="25" r={headR/10} fill={colors.stroke} />
                                        <circle cx="62" cy="25" r={headR/10} fill={colors.stroke} />
                                        <circle cx="39" cy="23" r={headR/25} fill="white" opacity="0.8" />
                                    </g>
                                    <path d="M46 38 Q50 42 54 38" fill="none" stroke={colors.stroke} strokeWidth="2.5" strokeLinecap="round" />
                                </g>
                            </g>
                        )}
                    </g>
                </svg>
            );
        };

        const App = () => {
            const [user, setUser] = useState(null);
            const [data, setData] = useState({});
            const [loading, setLoading] = useState(true);
            const dataRef = useRef({});

            const fetchData = async () => {
                try {
                    const res = await fetch(API_URL);
                    if (res.ok) {
                        const json = await res.json();
                        const monthData = json.may_v1 || {};
                        setData(monthData);
                        dataRef.current = monthData;
                    }
                    setLoading(false);
                } catch (e) { console.error("Sync Error", e); }
            };

            useEffect(() => {
                fetchData();
                const timer = setInterval(fetchData, 5000);
                const saved = localStorage.getItem('may_v1_active_user');
                if (saved) setUser(saved);
                return () => clearInterval(timer);
            }, []);

            const sync = async (newVal) => {
                if (!user) return;
                const updatedData = { ...dataRef.current, [user]: Math.max(0, newVal) };
                setData(updatedData);
                dataRef.current = updatedData;
                try {
                    await fetch(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ may_v1: updatedData })
                    });
                } catch (e) { console.error("Upload Error", e); }
            };

            const stats = useMemo(() => {
                const laps = NAMES.map(n => data[n] || 0);
                const total = laps.reduce((a, b) => a + b, 0);
                const hatched = laps.filter(l => l >= 15).length;
                return { total, hatched, average: (total / NAMES.length).toFixed(1) };
            }, [data]);

            const sorted = NAMES.map(n => ({ name: n, laps: data[n] || 0 })).sort((a, b) => b.laps - a.laps);

            if (loading) return (
                <div className="min-h-screen flex flex-col items-center justify-center bg-white text-pink-600">
                    <div className="w-12 h-12 border-4 border-pink-500 border-t-transparent rounded-full animate-spin mb-4"></div>
                    <div className="text-xl font-black animate-pulse">開啟五月份雲端大冒險...</div>
                </div>
            );

            return (
                <div className="min-h-screen p-4 flex flex-col items-center">
                    <header className="w-full max-w-4xl grid grid-cols-3 gap-4 mb-8">
                        <div className="stat-card p-4 rounded-3xl text-center">
                            <div className="text-pink-400 text-[10px] font-black italic uppercase">五月總圈數</div>
                            <div className="text-3xl font-black text-pink-700">{stats.total}</div>
                        </div>
                        <div className="stat-card p-4 rounded-3xl text-center border-amber-100">
                            <div className="text-amber-400 text-[10px] font-black italic uppercase">五月破蛋數</div>
                            <div className="text-3xl font-black text-amber-600">{stats.hatched}/28</div>
                        </div>
                        <div className="stat-card p-4 rounded-3xl text-center border-sky-100">
                            <div className="text-sky-400 text-[10px] font-black italic uppercase">平均力</div>
                            <div className="text-3xl font-black text-sky-700">{stats.average}</div>
                        </div>
                    </header>

                    {!user ? (
                        <div className="flex flex-col items-center w-full">
                            <h1 className="text-6xl font-black text-pink-800 mb-8 italic tracking-tighter">🌸 五月進化大冒險 🐾</h1>
                            <div className="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-7 gap-4 w-full max-w-7xl">
                                {NAMES.map(n => (
                                    <button key={n} onClick={() => { setUser(n); localStorage.setItem('may_v1_active_user', n); }} className="bg-white p-6 rounded-3xl shadow hover:shadow-xl transition-all border-4 border-transparent hover:border-pink-400 font-bold text-lg text-slate-700">
                                        {n}<div className="text-xs text-pink-400 mt-1 font-black">{data[n] || 0} 圈</div>
                                    </button>
                                ))}
                            </div>
                        </div>
                    ) : (
                        <div className="w-full max-w-2xl bg-white rounded-[4rem] shadow-2xl p-10 text-center border-8 border-white relative mb-12">
                            <button onClick={() => { setUser(null); localStorage.removeItem('may_v1_active_user'); }} className="absolute top-6 right-8 text-slate-300 underline font-bold">換人</button>
                            <h2 className="text-8xl font-black text-slate-800 mb-6 italic tracking-tighter">{user}</h2>
                            <div className="bg-pink-50/50 rounded-[4rem] h-80 flex items-center justify-center mb-8 shadow-inner border-4 border-white relative">
                                <Monster name={user} laps={data[user] || 0} size={350} />
                                <div className="absolute bottom-4 bg-white/90 px-6 py-2 rounded-full font-black text-pink-600 shadow-md text-xs italic">
                                    {(data[user] || 0) < 15 ? `距離破蛋還差 ${15 - (data[user] || 0)} 圈` : `五月晉級還差 ${10 - ((data[user] - 15) % 10)} 圈`}
                                </div>
                            </div>
                            <div className="text-[120px] font-black text-pink-600 leading-none mb-10 italic tracking-tighter">{data[user] || 0} <span className="text-2xl text-slate-300 not-italic">圈</span></div>
                            <button onClick={() => sync((data[user] || 0) + 1)} className="bg-slate-900 text-white w-full py-12 rounded-[3rem] text-8xl shadow-[0_20px_0_#000] btn-active transition-all flex flex-col items-center group">
                                <span className="mb-4 text-9xl group-active:scale-90 transition-transform">🐾</span><span className="text-4xl font-black italic tracking-widest uppercase">完成一圈</span>
                            </button>
                            <button onClick={() => sync((data[user] || 0) - 1)} className="mt-8 text-slate-300 text-sm underline font-bold">按錯了？扣除一圈</button>
                        </div>
                    )}

                    <div className="w-full max-w-5xl bg-white/70 backdrop-blur rounded-[3rem] p-8 border-4 border-white shadow-xl mb-20">
                        <h3 className="text-2xl font-black text-slate-700 mb-8 flex items-center gap-3 italic">🏆 五月份全班即時排行榜</h3>
                        <div className="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-7 gap-6">
                            {sorted.map((p, idx) => (
                                <div key={p.name} className={`relative p-3 rounded-3xl border-2 transition-all ${p.name === user ? 'bg-pink-50 border-pink-300 scale-105 shadow-md z-10' : 'bg-white border-slate-50'}`}>
                                    <div className="absolute -top-2 -left-2 w-6 h-6 bg-yellow-400 rounded-full flex items-center justify-center text-white font-black text-[10px] border-2 border-white shadow-sm">{idx + 1}</div>
                                    <div className="text-center font-black text-slate-700 text-xs truncate">{p.name}</div>
                                    <div className="h-16 flex items-center justify-center my-1"><Monster name={p.name} laps={p.laps} size={60} isMini={true} /></div>
                                    <div className="text-center text-lg font-black text-pink-600 leading-none">{p.laps}</div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
